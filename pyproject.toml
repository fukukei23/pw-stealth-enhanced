[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-stealth-enhanced"
version = "0.1.0"
description = "Enhanced stealth/anti-fingerprinting for Playwright. Successor to the deprecated playwright-stealth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "fukukei23" },
]
keywords = [
    "playwright",
    "stealth",
    "anti-detection",
    "fingerprint",
    "scraping",
    "bot-detection",
    "browser-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Playwright",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-playwright>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
